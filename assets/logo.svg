<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 58" width="260" height="58" fill="none">
  <defs>
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="orinGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <g filter="url(#logoGlow)">
    <!-- Authentic Engineer Construction Silhouette Icon -->
    <image href="data:image/png;base64," x="0" y="2" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    
    <!-- Brand Typography: STEELUX -->
    <text x="64" y="39" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="30" fill="url(#orinGradient)" letter-spacing="2.5">STEELUX</text>
  </g>
</svg>
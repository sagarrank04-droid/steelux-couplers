services:
  - type: web
    name: steelux-couplers
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: STEELUX
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://steelux-couplers.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
